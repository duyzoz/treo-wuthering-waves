services:
  - type: web
    name: treo-wuthering-waves
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TOKEN_DISCORD
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      - key: WELCOME_CHANNEL_ID
        sync: false
      - key: GOODBYE_CHANNEL_ID
        sync: false
      - key: FAKE_MEMBER_OFFSET
        value: "0"
      - key: OFFICIAL_BOT_MODE
        value: "true"
      - key: FULL_OFFICIAL_MODE
        value: "false"
      - key: STATUS_GIF_URL
        sync: false
      - key: EMBED_COLOR
        value: "0x6d5dfc"
      - key: DISABLE_WELCOME
        value: "false"
      - key: DISABLE_GOODBYE
        value: "false"
      - key: OBSERVABILITY_FILE
        value: "data/observability.json"
      - key: MONITOR_INTERVAL_MS
        value: "300000"
      - key: WELCOME_THROTTLE_MS
        value: "1800000"
      - key: UPTIME_START_TIMESTAMP
        sync: false
