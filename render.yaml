services:
  - type: web
    name: treo-wuthering-waves
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TOKEN_DISCORD
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      - key: WELCOME_CHANNEL_ID
        sync: false
      - key: GOODBYE_CHANNEL_ID
        sync: false
      - key: FAKE_MEMBER_OFFSET
        value: "0"
      - key: OFFICIAL_BOT_MODE
        value: "true"
      - key: FULL_OFFICIAL_MODE
        value: "false"
      - key: STATUS_GIF_URL
        sync: false
      - key: EMBED_COLOR
        value: "0x6d5dfc"
      - key: NIGHT_SAVER_ENABLED
        value: "true"
      - key: NIGHT_SAVER_START
        value: "23:00"
      - key: NIGHT_SAVER_END
        value: "07:00"
      - key: NIGHT_SAVER_TZ
        value: "Asia/Ho_Chi_Minh"
      - key: ADMIN_USER_IDS
        sync: false
      - key: ENABLE_MEMBER_EVENTS
        value: "false"
      - key: ADMIN_CONFIG_KEY
        sync: false
      - key: MAX_REQUESTS_PER_DAY
        value: "400"
      - key: MAX_DISCORD_UPDATES_PER_DAY
        value: "300"
      - key: MAX_IO_PER_DAY
        value: "1200"
      - key: DISABLE_WELCOME
        value: "false"
      - key: DISABLE_GOODBYE
        value: "false"
      - key: OBSERVABILITY_FILE
        value: "data/observability.json"
      - key: MONITOR_INTERVAL_MS
        value: "300000"
      - key: DISABLE_MONITOR
        value: "false"
      - key: MAINTENANCE_START
        value: ""
      - key: MAINTENANCE_END
        value: ""
      - key: WELCOME_THROTTLE_MS
        value: "1800000"
      - key: UPTIME_START_TIMESTAMP
        sync: false
